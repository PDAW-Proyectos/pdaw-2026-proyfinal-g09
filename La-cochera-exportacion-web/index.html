<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La cochera de Nidodo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="TemplateData/style.css">
<script>
// Unity may request pointer capture again before the browser resolves the first request.
// Reuse that request and ignore the already-captured case, without suppressing other errors.
(() => {
  const original = Element.prototype.requestPointerLock;
  if (!original) return;
  const requests = new WeakMap();
  Element.prototype.requestPointerLock = function(options) {
    if (document.pointerLockElement === this) return Promise.resolve();
    if (requests.has(this)) return requests.get(this);
    const result = original.call(this, options);
    if (!result || !result.then) return result;
    const pending = result.catch(error => {
      if (document.pointerLockElement !== this) throw error;
    }).finally(() => requests.delete(this));
    requests.set(this, pending);
    return pending;
  };
})();

</script>
</head>
<body>
  <main id="unity-container">
    <div id="unity-fullscreen-container">
      <button id="pantalla-completa" type="button">Pantalla completa ⛶</button>
      <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Demo de La cochera de Nidodo"></canvas>
      <div id="unity-loading-container" role="status">
        <span>Cargando demo…</span>
        <progress id="unity-progress" max="1" value="0" aria-label="Carga de la demo"></progress>
      </div>
    </div>
    <div id="unity-warning" role="alert" hidden></div>
  </main>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const loading = document.querySelector('#unity-loading-container');
    const progress = document.querySelector('#unity-progress');
    const warning = document.querySelector('#unity-warning');
    const pantallaCompleta = document.querySelector('#pantalla-completa');
    const contenedor = document.querySelector('#unity-fullscreen-container');
    pantallaCompleta.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await contenedor.requestFullscreen();
      } catch {
        showBanner('El navegador no pudo activar la pantalla completa.', 'warning');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      pantallaCompleta.textContent = document.fullscreenElement
        ? 'Salir de pantalla completa ⛶' : 'Pantalla completa ⛶';
    });
    function showBanner(message, type) {
      const notice = document.createElement('p');
      notice.textContent = message;
      warning.appendChild(notice);
      warning.hidden = false;
      if (type !== 'error') setTimeout(() => {
        notice.remove();
        warning.hidden = !warning.children.length;
      }, 5000);
    }
    const config = {
      autoSyncPersistentDataPath: true,
      arguments: [],
      dataUrl: 'Build/web-completo.data.unityweb',
      frameworkUrl: 'Build/web-completo.framework.js.unityweb',
      codeUrl: 'Build/web-completo.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      fullscreenElementID: 'unity-fullscreen-container',
      companyName: 'Nidodo',
      productName: 'La cochera de Nidodo Unity',
      productVersion: '0.12',
      showBanner
    };
    const loader = document.createElement('script');
    loader.src = 'Build/web-completo.loader.js';
    loader.onload = () => {
      createUnityInstance(canvas, config, value => {
        progress.value = value;
      }).then(() => {
        loading.hidden = true;
      }).catch(error => {
        loading.hidden = true;
        showBanner('No se pudo cargar la demo. Recargá la página para reintentar.', 'error');
        console.error(error);
      });
    };
    loader.onerror = () => {
      loading.hidden = true;
      showBanner('No se pudo descargar el juego. Revisá la conexión y recargá la página.', 'error');
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>

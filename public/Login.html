
<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — La cochera de Nidodo</title>
  <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/comun.css">
  <script src="./js/componentes.js" defer></script>
</head>
<body>
  <cabecera-sitio></cabecera-sitio>
  <main class="container-fluid px-3 px-lg-4 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <p class="text-uppercase fw-bold font-monospace mb-2">
          empezar turno 
        </p>
        <h1 class="display-5 fw-bold font-monospace mb-3">
          Iniciar sesion
        </h1>
        <p class="text-secondary mb-4">
        </p>
        <form id="formLogin" novalidate>
          <div class="mb-3">
          <label for="email" class="form-label">
              Correo electrónico
          </label>

          <input
              type="email"
              class="form-control rounded-0 p-3"
              id="email"
              name="email"
              placeholder="Correo electrónico"
              autocomplete="email"
              required
          >
          <div id="errorEmail" class="text-danger small mt-1"></div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>
            <input
              type="password"
              class="form-control rounded-0 p-3"
              id="password"
              name="password"
              minlength="8"
              autocomplete="current-password"
              placeholder="Contraseña"
              required
            >
            <div id="errorPassword" class="text-danger small mt-1"></div>
          </div>
          <button
            id="BtnLogin"
            type="submit"
            class="btn btn-dark rounded-0 w-100 py-3 fw-semibold">
            Iniciar sesion ↗
          </button>
          <div id="errorLogin" class="text-danger small mt-3 text-center"></div>
          <p class="text-center mt-4">
            ¿No tenés una cuenta?
            <a href="/Registro.html"
               class="text-dark fw-bold">
              Crear cuenta
            </a>
          </p>
        </form>
        <section class="mt-4 pt-4 border-top text-center" aria-label="Ingreso con Google">
          <p class="text-secondary">También podés continuar con Google</p>
          <div id="boton-google" class="d-flex justify-content-center"></div>
          <p id="estado-google" class="small mt-3" role="status" aria-live="polite">Cargando el botón de Google…</p>
          <button id="reintentar-google" type="button" class="btn btn-outline-dark rounded-0" hidden>Volver a cargar Google</button>
        </section>
      </div>
    </div>

  </main>
  <pie-sitio></pie-sitio>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/Login.js"></script>
  <script src="./js/LoginGoogle.js"></script>
</body>
</html>

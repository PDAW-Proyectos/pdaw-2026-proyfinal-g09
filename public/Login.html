
<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — La cochera de Nidodo</title>
  <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/comun.css">
  <script src="./js/componentes.js" defer></script>
</head>
<body>
  <cabecera-sitio></cabecera-sitio>
  <main class="container-fluid px-3 px-lg-4 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <p class="text-uppercase fw-bold font-monospace mb-2">
          empezar turno 
        </p>
        <h1 class="display-5 fw-bold font-monospace mb-3">
          Iniciar sesion
        </h1>
        <p class="text-secondary mb-4">
        </p>
        <form id="formRegistro" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">
              Nombre de usuario
            </label>
            <input
              type="text"
              class="form-control rounded-0 p-3"
              id="username"
              name="username"
              placeholder="Nombre de usuario"
              minlength="3"
              maxlength="20"
              autocomplete="username"
              required
            >
            <div id="errorUsername" class="text-danger small mt-1"></div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>
            <input
              type="password"
              class="form-control rounded-0 p-3"
              id="password"
              name="password"
              minlength="8"
              autocomplete="password"
              placeholder="Contraseña"
              required
            >
            <div id="errorPassword" class="text-danger small mt-1"></div>
          </div>
          <button
            id="BtnRegistro"
            type="submit"
            class="btn btn-dark rounded-0 w-100 py-3 fw-semibold">
            Iniciar sesion ↗
          </button>
          <p class="text-center mt-4">
            ¿No tenés una cuenta?
            <a href="/Registro.html"
               class="text-dark fw-bold">
              Crear cuenta
            </a>
          </p>
        </form>
      </div>
    </div>

  </main>
  <pie-sitio></pie-sitio>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro — La cochera de Nidodo</title>
  <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/comun.css">
</head>
<body>
  <header>
  <nav class="navbar navbar-expand-lg py-3 franja">
    <div class="container-fluid px-3 px-lg-4 ">
      <a class="navbar-brand d-flex align-items-center gap-3 fw-bold"
         href="/index.html">

        <img
          src="./img/18759e18-e4d5-4e91-9a66-80a6d153bdf6.png"
          alt="Logo de Nidodo"
          width="65"
          height="65"
          class=""
        >
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNidodo"
        aria-controls="navbarNidodo"
        aria-expanded="false"
        aria-label="Abrir menú"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNidodo">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item">
            <a class="nav-link active fw-semibold"
               aria-current="page"
               href="/index.html">
              Inicio
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/noticias.html">
              Noticias
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/foro.html">
              Comunidad
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/donaciones.html">
              Contribuir
            </a>
          </li>
        </ul>
        <div class="d-flex gap-2 ms-lg-4 mt-3 mt-lg-0">
          <a href="/login.html"
             class="btn btn-outline-dark rounded-0 px-3">
            Iniciar sesión
          </a>
          <a href="/registro.html"
             class="btn btn-dark rounded-0 px-3">
            Registrarse ↗
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>
  <main class="container-fluid px-3 px-lg-4 py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <p class="text-uppercase fw-bold font-monospace mb-2">
          solicitud de empleo
        </p>
        <h1 class="display-5 fw-bold font-monospace mb-3">
          Crear una cuenta.
        </h1>
        <p class="text-secondary mb-4">
          Registrate para participar de la comunidad
          y seguir las novedades del proyecto.
        </p>
        <form id="formRegistro">
          <div class="mb-3">
            <label for="username" class="form-label">
              Nombre de usuario
            </label>
            <input
              type="text"
              class="form-control rounded-0 p-3"
              id="username"
              name="username"
              placeholder="Tu nombre de usuario"
              minlength="3"
              maxlength="20"
              autocomplete="username"
              required
            >
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">
              Correo electrónico
            </label>
            <input
              type="email"
              class="form-control rounded-0 p-3"
              id="email"
              name="email"
              placeholder="nombre@ejemplo.com"
              autocomplete="email"
              required
            >
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">
              Contraseña
            </label>
            <input
              type="password"
              class="form-control rounded-0 p-3"
              id="password"
              name="password"
              minlength="8"
              autocomplete="new-password"
              placeholder="Mínimo 8 caracteres"
              required
            >
          </div>
          <div class="mb-4">
            <label for="confirmPassword" class="form-label">
              Confirmar contraseña
            </label>
            <input
              type="password"
              class="form-control rounded-0 p-3"
              id="confirmPassword"
              name="confirmPassword"
              autocomplete="new-password"
              placeholder="Repetí tu contraseña"
              required
            >
          </div>
          <div id="errorRegistro"
               class="alert alert-danger d-none"
               role="alert">
          </div>
          <button
            type="submit"
            class="btn btn-dark rounded-0 w-100 py-3 fw-semibold">
            CREAR CUENTA ↗
          </button>
          <p class="text-center mt-4">
            ¿Ya tenés una cuenta?
            <a href="./login.html"
               class="text-dark fw-bold">
              Iniciar sesión
            </a>
          </p>
        </form>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
